feature: analytics_pageview_collection
description: 공개 페이지뷰 요청을 검증하고 개인정보 최소화 정책에 따라 저장하거나 제외한다.
test_files:
  - tests/Unit/AnalyticsPageViewCollectionTest.php
  - tests/Feature/Public/PageViewApiTest.php
axes:
  module_enabled: [true, false]
  actor: [guest, member]
  source: [initial, spa, invalid]
  path: [public, admin, api, asset, malformed]
  privacy: [normal, dnt, gpc]
  bot: [true, false]
  duplicate: [first, repeated]
  referrer: [none, internal, external, unsafe]
  locale: [supported, unsupported, null]
effects:
  - recorded
  - skipped
  - validation_failed
  - throttled
  - no_raw_personal_data
  - user_reference_optional
  - normalized_path
  - normalized_referrer
  - no_aggregation
  - no_client_tracker
